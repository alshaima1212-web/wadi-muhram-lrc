<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>حجز مركز مصادر التعلم</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root{--bg:#f6f1e8;--card:#fffdf8;--ink:#2d3a35;--muted:#738078;--brand:#496d5b;--brand2:#d9b879;--line:#e4ddd1;--ok:#3e8b68;--busy:#b85d58;--shadow:0 18px 45px rgba(57,65,58,.10)}*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}#app{min-height:100vh;background:var(--bg)}.wrap{max-width:1180px;margin:auto;padding:28px 18px 44px}.hero{background:linear-gradient(135deg,#496d5b,#314e40);color:white;border-radius:26px;padding:30px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;left:-80px;top:-110px;background:rgba(255,255,255,.08)}.brand{display:flex;gap:14px;align-items:center}.mark{width:58px;height:58px;border-radius:18px;background:#fff;color:var(--brand);display:grid;place-items:center;font-size:28px;font-weight:800}.hero h1{margin:0;font-size:30px}.hero p{margin:8px 0 0;color:#e8f0eb}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0}.note{color:var(--muted);font-size:14px}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}.btn.primary{background:var(--brand);color:white}.btn.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.table-card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:auto}.grid{min-width:780px;display:grid;grid-template-columns:100px repeat(5,1fr)}.cell{min-height:86px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px;display:flex;align-items:center;justify-content:center}.head{background:#f1eadf;font-weight:800;min-height:54px}.period{font-weight:800;background:#faf7f0}.slot{width:100%;height:62px;border:1px solid #cfe2d7;background:#edf8f1;color:#286d4e;border-radius:15px;cursor:pointer;font-weight:800;transition:.15s}.slot:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(40,109,78,.12)}.slot.busy{background:#f8e9e8;border-color:#ebc5c2;color:#a34e49;cursor:not-allowed}.legend{display:flex;gap:14px;align-items:center;margin:14px 2px;font-size:13px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:5px}.green{background:#3e8b68}.red{background:#b85d58}.modal{position:fixed;inset:0;background:rgba(23,31,27,.42);display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.show{display:flex}.dialog{width:min(560px,100%);background:var(--card);border-radius:24px;padding:24px;box-shadow:0 25px 80px rgba(0,0,0,.25)}.dialog h2{margin-top:0}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:white}.actions{display:flex;gap:10px;justify-content:flex-start;margin-top:18px}.empty{color:var(--muted);font-size:13px}.toast{position:fixed;bottom:20px;left:20px;background:#263b31;color:white;padding:12px 16px;border-radius:12px;display:none;z-index:10}.toast.show{display:block}@media(max-width:700px){.wrap{padding:12px 8px 24px}.hero{padding:18px;border-radius:20px}.brand{gap:10px}.mark{width:46px;height:46px;border-radius:14px;font-size:22px}.hero h1{font-size:20px}.hero p{font-size:13px;margin-top:5px}.toolbar{align-items:stretch;flex-direction:column;margin:14px 0}.toolbar>div:last-child{display:grid!important;grid-template-columns:1fr 1.4fr 1fr;gap:6px!important;width:100%}.toolbar>div:last-child .btn:last-child{grid-column:1/-1}.btn{padding:10px 8px;font-size:13px}.toolbar input[type=date]{min-width:0;width:100%;font-size:13px;text-align:center}.legend{justify-content:center;margin:10px 0;font-size:12px}.table-card{border-radius:16px}.grid{min-width:620px}.cell{min-height:64px;padding:6px;font-size:12px}.head{min-height:46px}.period{font-size:12px}.slot{height:48px;border-radius:11px;font-size:12px}.dialog{padding:18px;border-radius:20px;max-height:92vh;overflow:auto}.dialog h2{font-size:20px}.field{margin:11px 0}.field input,.field select,.field textarea{padding:11px;font-size:16px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .btn{width:100%}}
</style>
</head>
<body>
<div id="app"><main class="wrap">
<section class="hero"><div class="brand"><div class="mark">م</div><div><h1>مركز مصادر التعلم</h1><p>مدرسة وادي محرم للتعليم الأساسي (١–١٢)</p><p style="margin-top:6px;font-weight:700">أخصائية مصادر التعلم: أ. الشيماء العزرية</p></div></div></section>
<div class="toolbar"><div><strong>جدول الحجز الأسبوعي</strong><div class="note">اختاري التاريخ للتنقل بين الأيام، ثم اضغطي على الخانة المتاحة لإضافة حجز.</div></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn secondary" onclick="changeDate(-1)">‹ السابق</button><input id="datePicker" type="date" class="btn secondary" style="font-weight:700" onchange="setDate(this.value)"><button class="btn secondary" onclick="changeDate(1)">التالي ›</button></div></div>
<div class="legend"><span><i class="dot green"></i>متاحة</span><span><i class="dot red"></i>محجوزة</span></div>
<section class="table-card"><div id="grid" class="grid"></div></section>
</main></div>
<div id="modal" class="modal"><div class="dialog"><h2>حجز مركز مصادر التعلم</h2><div id="selected" class="note"></div><form id="form"><div class="field"><label>اسم المعلمة</label><input id="teacher" required placeholder="اكتبي الاسم"/></div><div class="field"><label>الصف الدراسي</label><select id="grade" required><option value="">اختاري الصف</option><script>for(let i=1;i<=12;i++)document.write(`<option>${i}</option>`)</script></select></div><div class="field"><label>المواد المراد استخدامها</label><textarea id="materials" rows="3" placeholder="مثال: جهاز العرض، الحاسوب، الكتب..." required></textarea></div><div class="actions"><button class="btn primary" type="submit">تأكيد الحجز</button><button type="button" class="btn secondary" onclick="closeModal()">إلغاء</button></div></form></div></div><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://gtzmogywilrdtipelwyg.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0em1vZ3l3aWxyZHRpcGVsd3lnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MzIyOTIsImV4cCI6MjEwNjMwODI5Mn0.pu4cwasyoZFCNeWqrTekI8UL1_9SvT6YzSPl0Gv0fI8';
const EMAILJS_PUBLIC_KEY='CbAYt5xNndEJx0om_';
const EMAILJS_SERVICE_ID='service_v6cgnfg';
const EMAILJS_TEMPLATE_ID='template_i6bvvom';
emailjs.init({publicKey:EMAILJS_PUBLIC_KEY});
const days=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس'], periods=['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة']; let currentDate=new Date(); currentDate.setHours(0,0,0,0); let bookings=[]; let selected=null;
function dateKey(d){return d.toISOString().slice(0,10)} function sundayOf(d){let x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x} function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
async function api(path,options={}){let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);try{let r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...options,mode:'cors',cache:'no-store',signal:controller.signal,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,Accept:'application/json','Content-Type':'application/json',...(options.headers||{})}});if(!r.ok){let t=await r.text();let msg=t;try{let j=JSON.parse(t);msg=j.message||j.hint||j.details||j.code||t}catch(_){}throw new Error((msg||'تعذر الاتصال بقاعدة البيانات')+' ['+r.status+']')}if(r.status===204)return null;let t=await r.text();if(!t.trim())return null;try{return JSON.parse(t)}catch(_){return null}}catch(e){if(e.name==='AbortError')throw new Error('انتهت مهلة الاتصال بقاعدة البيانات');if(e instanceof TypeError)throw new Error('تعذر الوصول إلى خادم Supabase. تأكدي من إعدادات الرابط والمفتاح وRLS.');throw e}finally{clearTimeout(timer)}}
async function refreshBookings(){try{let start=dateKey(sundayOf(currentDate)),end=dateKey(addDays(sundayOf(currentDate),4));bookings=await api('bookings?select=id,booking_date,day_name,period,teacher_name,grade,materials,created_at&booking_date=gte.'+start+'&booking_date=lte.'+end+'&order=booking_date.asc,period.asc');render()}catch(e){console.warn('تعذر تحميل الحجوزات:',e)}}
function findBooking(date,period){return bookings.find(b=>b.booking_date===date&&b.period===period)}
function render(){let g=document.getElementById('grid'),start=sundayOf(currentDate);g.innerHTML='<div class="cell head">الحصة</div>'+days.map((d)=>`<div class="cell head">${d}</div>`).join('');periods.forEach((p,pi)=>{g.innerHTML+=`<div class="cell period">${p}</div>`;days.forEach((d,dayi)=>{let cellDate=addDays(start,dayi),date=dateKey(cellDate),b=findBooking(date,pi+1);g.innerHTML+=`<div class="cell"><button class="slot ${b?'busy':''}" ${b?'disabled':''} onclick="openModal('${date}','${d}','${p}',${pi+1})">${b?'محجوز':'متاحة'}</button></div>`})});document.getElementById('datePicker').value=dateKey(currentDate)}
function setDate(v){if(!v)return;currentDate=new Date(v+'T00:00:00');refreshBookings()} function changeDate(n){currentDate=addDays(currentDate,n);refreshBookings()}
function openModal(date,day,period,periodNumber){if(findBooking(date,periodNumber)){toast('هذه الحصة محجوزة بالفعل');return}selected={date,day,period,periodNumber};document.getElementById('selected').textContent=`${new Intl.DateTimeFormat('ar-OM',{year:'numeric',month:'long',day:'numeric'}).format(new Date(date+'T00:00:00'))} — ${day} — الحصة ${period}`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show');document.getElementById('form').reset();selected=null}

document.getElementById('form').addEventListener('submit',async e=>{
 e.preventDefault();
 if(!selected)return;
 const chosen={...selected};
 const teacherName=document.getElementById('teacher').value.trim(),gradeValue=document.getElementById('grade').value,materialsValue=document.getElementById('materials').value.trim();
 const payload={booking_date:chosen.date,day_name:chosen.day,period:chosen.periodNumber,teacher_name:teacherName,grade:gradeValue,materials:materialsValue};
 const button=e.target.querySelector('button[type="submit"]');
 button.disabled=true;button.textContent='جارٍ تأكيد الحجز...';
 try{
   await api('bookings',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});
   bookings.push({id:'local-'+Date.now(),...payload});
   closeModal();render();
   try{await emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,{teacher_name:teacherName,booking_date:chosen.date,day_name:chosen.day,period:chosen.period,grade:gradeValue,materials:materialsValue});toast('تم الحجز وإرسال التفاصيل إلى البريد الإلكتروني')}
   catch(mailErr){console.warn('تعذر إرسال البريد:',mailErr);toast('تم الحجز، لكن تعذر إرسال البريد الإلكتروني')}
   setTimeout(refreshBookings,300)
 }catch(err){if(String(err.message).includes('duplicate')||String(err.message).includes('23505')){toast('هذه الحصة محجوزة بالفعل');await refreshBookings()}else toast('تعذر تسجيل الحجز: '+err.message)}
 finally{button.disabled=false;button.textContent='تأكيد الحجز'}
});
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),3000)}
render();refreshBookings();
</script></body></html>
